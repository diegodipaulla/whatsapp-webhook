<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com 'unsafe-eval';">
  <title>WhatsApp Conexão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'wa-light-primary': '#f0f2f5',
            'wa-light-secondary': '#ffffff',
            'wa-text-primary': '#41525d',
            'wa-text-secondary': '#667781',
            'wa-green': '#00a884',
            'wa-teal': '#008069',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-wa-light-primary">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function WhatsAppLogo() {
      return (
        <svg viewBox="0 0 16 16" className="h-12 w-12 text-wa-text-secondary mb-4">
          <path fill="currentColor" d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.068-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
        </svg>
      );
    }

    function Spinner() {
      return (
        <div className="h-10 w-10 animate-spin rounded-full border-4 border-wa-green border-t-transparent"></div>
      );
    }

    function App() {
      const [status, setStatus] = useState('initializing');
      const [qrCode, setQrCode] = useState('');

      useEffect(() => {
        window.electronAPI.onQRCode((qr) => {
          setQrCode(qr);
          setStatus('qr');
        });
        window.electronAPI.onConnected(() => setStatus('connected'));
        window.electronAPI.onAuthFailure(() => setStatus('failure'));
      }, []);

      const states = {
        initializing: (
          <div className="flex flex-col items-center justify-center text-center">
            <WhatsAppLogo />
            <Spinner />
            <h1 className="text-xl font-medium text-wa-text-primary mt-4">Inicializando...</h1>
            <p className="text-wa-text-secondary mt-1">Aguarde, por favor.</p>
          </div>
        ),
        qr: (
          <div className="flex flex-col items-center justify-center text-center">
            <h1 className="text-2xl text-wa-text-primary mb-4">Conectar ao WhatsApp</h1>
            <div className="bg-wa-light-secondary p-4 rounded-lg shadow-md">
              <img src={qrCode} alt="QR Code do WhatsApp" className="w-64 h-64" />
            </div>
            <p className="text-wa-text-secondary mt-4 text-sm">Abra o WhatsApp e escaneie o código.</p>
          </div>
        ),
        connected: (
          <div className="flex flex-col items-center justify-center text-center">
            <WhatsAppLogo />
            <h1 className="text-xl font-medium text-wa-teal mt-4">Conectado com Sucesso!</h1>
            <p className="text-wa-text-secondary mt-1">A janela será fechada em breve.</p>
          </div>
        ),
        failure: (
          <div className="flex flex-col items-center justify-center text-center">
            <WhatsAppLogo />
            <h1 className="text-xl font-medium text-red-500 mt-4">Falha na Conexão</h1>
            <p className="text-wa-text-secondary mt-1">Tente novamente.</p>
          </div>
        ),
      };

      return (
        <div className="flex items-center justify-center h-screen">
          {states[status]}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
